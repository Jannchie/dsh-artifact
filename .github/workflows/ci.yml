name: CI

# Runs on every push and pull request. Until this existed the only thing that
# ever checked the code was the publish workflow, which runs after a tag — so a
# syntax error or a broken store reached a release before anything noticed.

on:
  push:
    branches: ['**']
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Path confinement and the store's parent-directory handling are
        # separator-sensitive, so they are worth proving on both families.
        os: [ubuntu-latest, windows-latest]
        node: [20, 22]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}

      # No install step: the plugin's runtime dependencies are supplied by the
      # harness, and the store deliberately imports nothing outside `node:*`.
      - name: Syntax-check every shipped file
        run: node scripts/check.mjs

      - name: Test the artifact store
        run: node scripts/test.mjs
